syntax = "proto3";

package proto;

option go_package = "internal/model";

message Ws {
  oneof payload {
    WsPixel            pixel              = 1;
    WsPixelRegion      pixel_region       = 2;
    WsPixelError       pixel_error        = 3;
    WsPixelRegionError pixel_region_error = 4;
  }
}

message WsPixel {
  int32 x     = 1;
  int32 y     = 2;
  int32 color = 3;
}

message WsPixelRegion {
  int32 x1    = 1;
  int32 x2    = 2;
  int32 y1    = 3;
  int32 y2    = 4;
  int32 color = 5;
}

message WsPixelError {
  int32  x       = 1;
  int32  y       = 2;
  string message = 3;
}

message WsPixelRegionError {
  int32 x1 = 1;
  int32 x2 = 2;
  int32 y1 = 3;
  int32 y2 = 4;
  string message = 5;
}

message PixelField {
  int32 width        = 1;
  int32 height       = 2;
  bytes pixel_colors = 3;
}
